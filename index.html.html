,'Call an external audit first'],'Choose')}${S.alert=='Revise my priority'?`<label>New first priority</label>${sel('pick2',KY.map(k=>SYS[k].n).filter(n=>n!=S.pick),'Choose')}`:''}<label>Confidence in your priority now: <b id="cf">${S.rsp.conf}%</b></label><input type="range" min="0" max="100" step="5" value="${S.rsp.conf}" oninput="S.rsp.conf=+this.value;$('cf').textContent=this.value+'%';save()"></div><div><div class="pop"><b>Your priority so far:</b> ${S.pick}.<br>Answer the three questions with the ratings and choices on the left. Your decision is whether to hold your priority, revise it, or ask for an audit first, backed by two pieces of evidence.</div></div></div>`)}

if(s==6){const r=[['Diagnose',...KY.flatMap(k=>[[SYS[k].n+' primary cause',S.est[k].d||'-'],[SYS[k].n+' Q4 forecast (if nothing changes)',S.est[k].q],[SYS[k].n+' points backed by evidence',backed(k)+' of 100']])],['Prioritise',...KY.map(k=>[SYS[k].n+' weighted score',mt(k)]),['Fix first',S.pick]],['New information',['Response',S.alert],['Evidence cited',[S.rsp.ev,S.rsp.ev2].filter(Boolean).map(i=>EXI[i].h).join('; ')||'-'],['Impact ratings (SmartLend / UPI Guard / FraudShield)',KY.map(nu).join(' / ')],['Importance of cited evidence',(S.rsp.i1||3)+' and '+(S.rsp.i2||3)+' of 5'],['Would investigate',S.inv||'-'],['Confidence',S.rsp.conf+'%'],['Final priority',fin()]],['Decide',['Path',S.path],['Trade-offs used',(S.tr||[]).join(', ')||'-'],['Task force owner',S.own],['Task force cadence',S.tf.cad],['Metric',S.gv.m],['Target',S.gv.t],['Governance owner',S.gv.o],['Review cadence',S.gv.c],['Escalation',S.gv.e],['Guardrails',gc()+' selected']]];
return H(`<h2>Decision Checklist</h2><table>${r.map(g=>`<tr class="sec"><td colspan="2">${g[0]}</td></tr>`+g.slice(1).map(x=>`<tr><td>${x[0]}</td><td><span class="chip">${x[1]??'-'}</span></td></tr>`).join('')).join('')}</table><p class="m">Submitting locks your decisions and generates your report.</p>`)}
const sc=score(),tt=sc.reduce((a,x)=>a+x[1],0);return`<h2>Synopsis</h2><div class="card"><p>Final priority: <b>${fin()}</b> (your matrix ranked ${mtop()} first). Path: <b>${S.path}</b>. Owner: <b>${S.own}</b>.</p><h3>Decision quality: ${tt} / 100</h3>${sc.map(x=>`<div class="row"><span>${x[0]} <span class="m">${x[2]}</span></span><b>${x[1]}/${x[3]}</b></div><div class="bar"><i style="width:${x[1]/x[3]*100}%"></i></div>`).join('')}<button class="sm" onclick="if(confirm('Start over?')){const c=S.code;S=DEF();S.reg=1;S.code=c;S.v='arena';save();draw()}">Start again</button></div>`}
function lead(){if(sb)lbLoad();const rows=sb?(LB||[]).map(r=>[r.name,r.summary,r.score]):[['Participant 1','SmartLend, In-house overhaul',78,31.2],['Participant 2','FraudShield, External audit',72,38.5],['Participant 3','FraudShield, Tactical fix',69,40.1],['Participant 4','UPI Guard, In-house overhaul',64,47.8],['Participant 5','SmartLend, Tactical fix',58,55.3]];if(!sb&&S.done)rows.push([(U&&U.name||'You')+' (you)',fin()+', '+S.path,score().reduce((a,x)=>a+x[1],0),+lab(S.t).k.toFixed(1)]);rows.sort((a,b)=>b[2]-a[2]);const q=rows.map(r=>r[2]).sort((a,b)=>a-b),av=q.reduce((a,b)=>a+b,0)/(q.length||1),md=q[q.length>>1]||0;
return`<h2>Leaderboard</h2><div class="g"><div>Average score<b>${av.toFixed(1)}</b></div><div>Median score<b>${md}</b></div></div><div class="wrap"><table><tr><th>Rank</th><th>Name</th><th>Decision</th><th>Final score</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table></div><p class="m">${sb?'Results from participants who have submitted their decisions.':'Sample rows until the database stores real participant results.'}</p>`}
function draw(){const a=S.v=='courses',hd=(tabs)=>`<header><div class="hr"><div class="logo">INB Sim<small>LEADERSHIP SIMULATION</small></div><div class="meta">${a?'':`<div><i>Instructor</i>Course instructor</div><div><i>Current round</i>1 / 1</div>`}<div><i>Participant</i>${U?U.name:''}</div><button class="sm" onclick="S.v='courses';draw()">Home</button><button class="sm" onclick="fs()">Full screen</button><button class="sm" onclick="logout()">Sign out</button></div></div>${tabs}</header>`;let h;
if(a)h=hd('<div class="tb"><button class="on">ONGOING</button></div>')+`<main><p style="text-align:right"><button class="btn" onclick="ov.style.display='flex'">Register to new course</button></p>${S.reg?`<div class="card" style="cursor:pointer;max-width:620px;margin:20px auto;border-color:#f0b27a" onclick="go(S.st)"><div class="row"><div><span class="m">Course code: ${S.code}</span><h2 style="margin:4px 0">INB AI Governance Simulation 2026</h2><span class="m">Round: 1 / 1</span></div><div class="m">Start 3/10/2026<br>End 10/10/2026</div></div></div>`:'<p class="m" style="text-align:center;margin-top:60px">No courses yet. Register with your course code.</p>'}</main>`;
else{const tb=`<div class="tb">${[['arena','Game Arena'],['read','Readings'],['lead','Leaderboard']].map(t=>`<button class="${S.v==t[0]?'on':''}" onclick="S.v='${t[0]}';draw()">${t[1]}</button>`).join('')}</div>`,sp=S.v=='arena'?`<div class="stp">${ST.slice(0,LAST+1).map((n,i)=>`<button class="${i==S.st?'on':i<=S.max?'ok':''}" ${i>S.max?'disabled':''} onclick="go(${i})">${n}</button>`).join('')}</div>`:'';
const body=S.v=='arena'?stage()+(S.st<=LAST&&S.st<7?`<p style="margin-top:20px">${S.st>0?`<button class="sm" onclick="go(${S.st-1})">Back</button> `:''}<button class="btn" id="nx" onclick="nxt()">${S.st==LAST?'Save progress':S.st==3?'Lock priority':S.st==6?'Submit decisions':'Continue'}</button> <span id="sv" class="m"></span></p><p class="m" id="hn" style="color:var(--w)"></p>`:''):S.v=='lead'?lead():`<h2>Readings</h2><div class="two"><div class="card"><h3>Materials from instructor</h3><p class="m">None uploaded yet.</p></div><div class="card"><h3>Game Instructions</h3><p><b>Decision-making instruction</b><br><span class="m">The decision process, step by step.</span></p><button class="btn">Read</button><p style="margin-top:14px"><b>Walkthrough video</b><br><span class="m">A tutorial on making decisions.</span></p><button class="btn" onclick="vid()">View</button></div></div>`;
h=hd(tb+sp)+`<main>${body}</main>`}
$('root').innerHTML=h;gate()}
function reg(){const c=$('cc').value.trim();if(!c)return;S.reg=1;S.code=c;save();ov.style.display='none';draw()}
function jwt(t){const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(atob(b).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')))}
function onCred(r){const p=jwt(r.credential);if(ALLOWED_DOMAINS.length&&!ALLOWED_DOMAINS.includes(p.email.split('@')[1])){$('lm').textContent='This account is not allowed.';return}U={name:p.name,email:p.email};try{localStorage.setItem('inbu',JSON.stringify(U))}catch(e){}enter()}
function demo(){U={name:'Guest',email:'guest'};enter();fs()}
function enter(){load();sp();$('login').style.display='none';draw()}
function showLogin(){$('root').innerHTML='';$('login').style.display='flex';if(SB_ON){$('gb').innerHTML='<button class="btn" onclick="sbLogin()">Continue with Google</button>';$('su').style.display=ALLOW_GUEST?'block':'none';return}if(CLIENT_ID.startsWith('YOUR_')){$('su').style.display='block';return}(function i(){if(!window.google||!google.accounts){setTimeout(i,200);return}google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCred});google.accounts.id.renderButton($('gb'),{theme:'outline',size:'large'})})()}
function logout(){if(sb)sb.auth.signOut();U=null;try{localStorage.removeItem('inbu');google.accounts.id.disableAutoSelect()}catch(e){}if(document.fullscreenElement)document.exitFullscreen();showLogin()}

function okDom(e){return!ALLOWED_DOMAINS.length||ALLOWED_DOMAINS.includes((e||'').split('@')[1])}
function sbLogin(){sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}})}
async function sbUser(u){const e=u.email||'';if(!okDom(e)){await sb.auth.signOut();U=null;showLogin();$('lm').textContent='This account is not allowed.';return}U={id:u.id,email:e,name:(u.user_metadata&&(u.user_metadata.full_name||u.user_metadata.name))||e.split('@')[0]};enter();cloudLoad()}
async function sbBoot(){try{const r=await sb.auth.getSession(),ss=r.data&&r.data.session;if(ss)await sbUser(ss.user);else showLogin()}catch(e){showLogin()}sb.auth.onAuthStateChange((ev)=>{if(ev=='SIGNED_OUT'&&U&&U.id){U=null;showLogin()}})}
function cs(){if(!sb||!U||!U.id)return;clearTimeout(ct);ct=setTimeout(async()=>{try{const r=await sb.from('progress').upsert({user_id:U.id,email:U.email,name:U.name,state:S,done:!!S.done,updated_at:new Date().toISOString()});if(r&&r.error)throw r.error}catch(e){console.warn('Save failed',e)}},800)}
async function cloudLoad(){try{const r=await sb.from('progress').select('state').eq('user_id',U.id).maybeSingle();if(r.error)throw r.error;if(r.data&&r.data.state){S=Object.assign(DEF(),r.data.state);sp();try{localStorage.setItem(key(),JSON.stringify(S))}catch(e){}draw()}else save()}catch(e){console.warn('Load failed',e)}}
async function lbLoad(){if(!sb||Date.now()-LT<15000)return;LT=Date.now();try{const r=await sb.from('leaderboard').select('name,summary,score').order('score',{ascending:false}).limit(50);if(r.error)throw r.error;LB=r.data;if(S.v=='lead')draw()}catch(e){console.warn('Leaderboard failed',e)}}
async function pushScore(){if(!sb||!U||!U.id)return;try{await sb.from('leaderboard').upsert({user_id:U.id,name:U.name,summary:fin()+', '+S.path,score:score().reduce((a,x)=>a+x[1],0),updated_at:new Date().toISOString()});LT=0}catch(e){console.warn('Score save failed',e)}}
if(SB_ON&&window.supabase){sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);U=null;sbBoot()}else if(SB_ON){showLogin();$('lm').textContent='Could not load the sign-in library. Check your connection.'}else U?enter():showLogin();
</script></body></html>
