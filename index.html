function stage(){const s=S.st;if(s==3)sp();const H=x=>FL?x:`<span class="stgc">STAGE ${Math.min(s+1,7)}: ${SUBT[s]}</span>${gdbar(s)}<div class="pop" id="pp" style="display:none"><b>Questions to think about</b><ul>${FT[s].map(q=>`<li>${q}</li>`).join('')}</ul></div>${x}`;

if(s==4){const sh={SmartLend:28,'UPI Guard':22,FraudShield:50},ci=Object.keys(S.cite).filter(i=>S.cite[i]&&EXI[i]);return H(`<div class="al"><h3>New Information: October 2024</h3><p>Two weeks into the new quarter, the ExCo receives an escalation from Customer Experience. Complaint volumes have increased across digital channels, with the largest increase coming from high-value customers and SME borrowers. Operations also reports that manual interventions have increased across lending and transaction-risk workflows.</p><p>The Risk team has requested an immediate review of whether the current AI controls are creating unintended customer friction.</p><p><b>Reassess your earlier priority:</b></p><ul><li>Does this information change your ranking?</li><li>Which evidence from the earlier analysis becomes more important?</li><li>What would you investigate before changing the decision?</li></ul></div><h2>New information</h2><div class="pop"><b>Your priority so far:</b> ${S.pick}. Answer the three questions below, then make your decision.</div><div class="two"><div class="card"><h3>1. Which system does this information point to most?</h3><p class="m">Think about where the complaints and the extra manual work are coming from. Choose one system.</p>${sel('focus',KY.map(k=>SYS[k].n),'Choose')}</div><div class="card"><h3>2. Which two pieces of evidence matter most now?</h3><p class="m">Choose two pieces of evidence from your earlier analysis.</p>${evs()}</div></div><div class="card" style="max-width:620px;margin:0 auto 16px"><h3>3. What would you investigate first?</h3>${sel('inv',['Complaints by customer segment','Manual interventions by workflow','False positives by customer segment','Document and verification failures by region'],'Choose')}<h3 style="margin-top:18px">Your decision</h3><label>Does the new information change your priority?</label>${sel('alert',['Hold my priority','Revise my priority','Call an external audit first'],'Choose')}${S.alert=='Revise my priority'?`<label>New first priority</label>${sel('pick2',KY.map(k=>SYS[k].n).filter(n=>n!=S.pick),'Choose')}`:''}</div>`)}

const NARR={
bank:()=>'Let me start with the bank. India National Bank is one of the largest public-facing banks in India, with over 60 million customers across retail, SME, corporate banking, wealth and payments. More than a third of all transactions already happen on digital channels, run by a central digital division, analytics and risk teams, and business heads who each own a vertical.',
ambition:()=>'A few years ago the ground began to shift. Fintechs and payment platforms were taking share, so between FY2022 and FY2026 INB set itself an ambition: become a <b>digitally trusted bank</b>, with the scale and trust of a traditional bank and the agility of a digital one. Four strategic verticals were created, and three of them became semi-autonomous initiatives, each with its own data science team and its own metrics.',
sysA:()=>'The first initiative is <b>SmartLend</b> ('+lc1(SYI2.A.tag).replace(/\.$/,'')+'). Its purpose: '+lc1(SYI2.A.b),
sysB:()=>'The second initiative is <b>UPI Guard</b> ('+lc1(SYI2.B.tag).replace(/\.$/,'')+'). Its purpose: '+lc1(SYI2.B.b),
sysC:()=>'The third initiative is <b>FraudShield</b> ('+lc1(SYI2.C.tag).replace(/\.$/,'')+'). Its purpose: '+lc1(SYI2.C.b),
cust:()=>'One more thing before I go on. Trust runs through all of this. INB’s fourth vertical, <b>Customer Trust and Market Presence</b>, was delivered through the CRM Rebuild programme. It is not one of the three systems you will diagnose, but keep it in mind as you go: which issues put the greatest risk on customer trust and long-term relationships?',
unfold:()=>'For a while it worked. When FY2025 began there was strong momentum across SmartLend, UPI Guard and FraudShield. Then, between April and September, delays, complaints and manual workarounds started to appear, and each team kept reporting on its own metrics. By Q3 the symptoms had converged, and an emergency review was called.',
scen:()=>'That brings us to today. INB weighed four options for becoming digitally capable and chose three, and they have now been running for about three years. In Q3 the operational problems arrived. <b>Three digital systems are failing at the same time.</b> Leadership can see the symptoms on the quarterly dashboard, but not the causes. The data you will use covers April to September 2024.',
impact:()=>'Here is what it has cost us. Every headline number worsened between Q1 and Q3: SME loan disbursals are down 48%, UPI fraud loss is up 418%, HNWI retention is down 4.9 points and digital NPS is down 22 points. Remember, these are symptoms, not causes.',
dash:()=>'This is the dashboard leadership sees for Q3. SmartLend funnel completion has fallen from 32% to 24%, document upload errors have risen to 11.8%, UPI fraud incidents are up 46%, refund volume is up 29%, the FraudShield PSI has risen by 0.10, and false positives for high-net-worth customers have climbed to 4.2%.',
zones:()=>'To judge numbers like these, INB uses four performance zones: Successful, Normal, Early warning and Failure. Notice where today’s figures fall, because you will use these zones when you judge each system.',
headA:()=>'Each system has an owner who will speak for it. <b>'+SYS.A.head+'</b> runs SmartLend, and will tell you what they are seeing. You will read the full report in Diagnose.',
headB:()=>'<b>'+SYS.B.head+'</b> runs UPI Guard, and has a different story to tell. Their full report is waiting for you in Diagnose.',
headC:()=>'And <b>'+SYS.C.head+'</b> runs FraudShield, with yet another view. You will meet their report in Diagnose too.',
mission:()=>'And this is where you come in. You are an ExCo member at INB. In the stages ahead you will diagnose the three systems, decide what to fix first and defend your decision. There is no single right answer. One request before we begin: please do not upload any dataset from this simulation to an AI tool, LLM or online analytics service.',
q:()=>'So the question on the table is simple, and it is not easy: <b>where do we begin?</b> Each Business Head will push for a different priority, with different risks, stakeholder impacts and dependencies. In Diagnose you will read their reports, study the evidence and trace what is really driving the decline.'};

if(!d){d=document.createElement('aside');d.id='gsb';document.body.appendChild(d);const sc=document.createElement('div');sc.id='gsbs';sc.onclick=()=>gsbT(0);document.body.appendChild(sc)}
d.style.display='';d.innerHTML=gsbBuild();document.body.classList.add('sbx');
let c=0;try{c=localStorage.getItem('gsbc')==='1'?1:0}catch(e){}document.body.classList.toggle('sbc',!!c);
const bt=Math.max(0,Math.round(hd.getBoundingClientRect().bottom));document.documentElement.style.setProperty('--gsbtop',bt+'px');d.style.top=bt+'px'}catch(e){}}
function gsbT(open){const d=document.getElementById('gsb');if(!d)return;
if(window.innerWidth>=900){if(open===0)return;const c=!document.body.classList.contains('sbc');document.body.classList.toggle('sbc',c);try{localStorage.setItem('gsbc',c?'1':'0')}catch(e){}return}
const sc=document.getElementById('gsbs'),on=open===undefined?!d.classList.contains('open'):!!open;d.classList.toggle('open',on);if(sc)sc.classList.toggle('open',on)}
function gsbUm(ev){ev.stopPropagation();const m=document.getElementById('gsum');if(m)m.classList.toggle('open')}
document.addEventListener('click',e=>{const m=document.getElementById('gsum');if(m&&m.classList.contains('open')&&!e.target.closest('.gsu,#gsum'))m.classList.remove('open')});
window.addEventListener('resize',()=>{try{gsbMount()}catch(e){}});
if(SB_ON&&window.supabase){sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);U=null;sbBoot()}else if(SB_ON){showLogin();$('lm').textContent='Could not load the sign-in library. Check your connection.'}else U?enter():showLogin();
</script></body></html>
